rules:
  - id: javascript.security.eval-code-injection
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: new Function(..., $X)
          - pattern: Function(..., $X)
      - pattern-not: eval("...")
      - pattern-not: new Function("...")
    message: "Dynamic code evaluation via eval() or new Function() allows arbitrary code execution if untrusted input is passed."
    severity: ERROR
    languages:
      - javascript
      - typescript
    metadata:
      cwe:
        - "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      confidence: HIGH
      remediation: "Avoid using eval() or dynamic Function constructors. Use safe JSON parsing or explicit logic instead."

  - id: javascript.security.child-process-command-injection
    patterns:
      - pattern-either:
          - pattern: child_process.exec($CMD, ...)
          - pattern: child_process.execSync($CMD, ...)
          - pattern: exec($CMD, ...)
          - pattern: execSync($CMD, ...)
      - pattern-not: child_process.exec("...", ...)
      - pattern-not: child_process.execSync("...", ...)
      - pattern-not: exec("...", ...)
      - pattern-not: execSync("...", ...)
    message: "Untrusted input passed to child_process.exec() can lead to OS command injection."
    severity: ERROR
    languages:
      - javascript
      - typescript
    metadata:
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      confidence: HIGH
      remediation: "Use child_process.execFile() or child_process.spawn() with shell: false and pass arguments as an array."

  - id: javascript.security.sql-injection-concatenation
    patterns:
      - pattern-either:
          - pattern: $DB.query(`...${$VAR}...`, ...)
          - pattern: $DB.execute(`...${$VAR}...`, ...)
          - pattern: $DB.query($QUERY + $VAR, ...)
          - pattern: $DB.execute($QUERY + $VAR, ...)
    message: "Constructing SQL queries through string concatenation or template literals allows SQL injection."
    severity: ERROR
    languages:
      - javascript
      - typescript
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      confidence: HIGH
      remediation: "Use parameterized queries or prepared statements with placeholder variables."

  - id: javascript.security.path-traversal-fs
    patterns:
      - pattern-either:
          - pattern: fs.readFile($PATH + $VAR, ...)
          - pattern: fs.readFileSync($PATH + $VAR, ...)
          - pattern: fs.createReadStream($PATH + $VAR, ...)
          - pattern: fs.promises.readFile($PATH + $VAR, ...)
          - pattern: fs.readFile(`...${$VAR}...`, ...)
          - pattern: fs.readFileSync(`...${$VAR}...`, ...)
    message: "Constructing filesystem paths with string concatenation allows path traversal and unauthorized file access."
    severity: WARNING
    languages:
      - javascript
      - typescript
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      confidence: MEDIUM
      remediation: "Normalize paths using path.resolve() and verify the target path stays within the base directory."

  - id: javascript.security.insecure-hash-algorithm
    patterns:
      - pattern-either:
          - pattern: crypto.createHash("md5")
          - pattern: crypto.createHash("sha1")
          - pattern: crypto.createHash('md5')
          - pattern: crypto.createHash('sha1')
    message: "MD5 and SHA-1 are cryptographically broken hash algorithms vulnerable to collision attacks."
    severity: WARNING
    languages:
      - javascript
      - typescript
    metadata:
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      confidence: HIGH
      remediation: "Use secure hashing algorithms such as SHA-256 (SHA-2) or SHA-512, or bcrypt/argon2 for passwords."

  - id: python.security.eval-exec
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: exec($X)
      - pattern-not: eval("...")
      - pattern-not: exec("...")
    message: "Dynamic code execution via eval() or exec() allows arbitrary code execution in Python."
    severity: ERROR
    languages:
      - python
    metadata:
      cwe:
        - "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      confidence: HIGH
      remediation: "Avoid eval() or exec(). Use ast.literal_eval() for safely parsing Python literals."

  - id: python.security.subprocess-shell-true
    patterns:
      - pattern-either:
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)
    message: "Executing subprocesses with shell=True facilitates command injection if arguments include untrusted data."
    severity: ERROR
    languages:
      - python
    metadata:
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      confidence: HIGH
      remediation: "Set shell=False and pass arguments as a list of strings."

  - id: python.security.insecure-hash-algorithm
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
    message: "MD5 and SHA-1 are cryptographically weak hashing algorithms."
    severity: WARNING
    languages:
      - python
    metadata:
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      confidence: HIGH
      remediation: "Use hashlib.sha256() or hashlib.sha512() instead."

  - id: python.security.sql-injection-format
    patterns:
      - pattern-either:
          - pattern: $CURSOR.execute(f"...{$VAR}...", ...)
          - pattern: $CURSOR.execute("..." % ($VAR), ...)
          - pattern: $CURSOR.execute("...".format($VAR), ...)
          - pattern: $CURSOR.execute($QUERY + $VAR, ...)
    message: "Formatted or concatenated SQL queries in Python permit SQL injection."
    severity: ERROR
    languages:
      - python
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      confidence: HIGH
      remediation: "Use parameterized queries passing parameters as a tuple/dictionary to execute()."
