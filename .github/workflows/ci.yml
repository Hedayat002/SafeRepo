name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: Run production build
        run: npm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/saferepo
          GITHUB_APP_ID: ci-placeholder-app-id
          GITHUB_CLIENT_ID: ci-placeholder-client-id
          GITHUB_CLIENT_SECRET: ci-placeholder-client-secret
          SESSION_SECRET: ci-placeholder-session-secret-32-chars-long
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          ALLOWED_ORIGINS: http://localhost:3000
