name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Run linter
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://admin:password@localhost:27017/saferepo_test?authSource=admin

      - name: Run production build
        run: npm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/saferepo
          GITHUB_APP_ID: ci-placeholder-app-id
          GITHUB_CLIENT_ID: ci-placeholder-client-id
          GITHUB_CLIENT_SECRET: ci-placeholder-client-secret
          SESSION_SECRET: ci-placeholder-session-secret-32-chars-long
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          ALLOWED_ORIGINS: http://localhost:3000
